name: Test and distribute
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag and package version differ");'
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Package source and compiled library
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-game-runtime
          path: release/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download validated distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name browser-game-runtime --dir release
      - name: Verify distribution and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --title "Browser Game Runtime $RELEASE_TAG" --notes-file CHANGELOG.md release/*.tgz release/SHA256SUMS
